name: Zian RCT CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-server-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Build and unit tests
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v5
        with:
          name: zianrct-${{ github.sha }}
          path: build/libs/zianrct-*.jar
          if-no-files-found: error

      - name: Prepare dedicated server with Rassvet fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world/datapacks
          fixture_tmp="$RUNNER_TEMP/rassvet-fixture"
          mkdir -p "$fixture_tmp"
          cat ci/fixtures/rassvet_fixture.zip.b64.* | base64 -d > "$fixture_tmp/rassvet_fixture.zip"
          unzip -q "$fixture_tmp/rassvet_fixture.zip" -d "$fixture_tmp/unpacked"
          cp -R "$fixture_tmp/unpacked/ci/fixtures/rassvet" run/world/datapacks/rassvet

          echo 'eula=true' > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          enable-rcon=true
          rcon.password=zianrct-ci
          rcon.port=25575
          max-players=4
          view-distance=4
          simulation-distance=4
          PROPS

      - name: Dedicated server Rassvet generation and reload smoke test
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/rcon.py" <<'PY'
          import socket
          import struct
          import sys
          import time

          HOST = "127.0.0.1"
          PORT = 25575
          PASSWORD = "zianrct-ci"

          def recv_exact(sock, size):
              data = b""
              while len(data) < size:
                  chunk = sock.recv(size - len(data))
                  if not chunk:
                      raise ConnectionError("RCON connection closed unexpectedly")
                  data += chunk
              return data

          def recv_packet(sock):
              size = struct.unpack("<i", recv_exact(sock, 4))[0]
              data = recv_exact(sock, size)
              request_id, packet_type = struct.unpack("<ii", data[:8])
              body = data[8:-2].decode("utf-8", errors="replace")
              return request_id, packet_type, body

          def send_packet(sock, request_id, packet_type, body):
              payload = struct.pack("<ii", request_id, packet_type) + body.encode("utf-8") + b"\x00\x00"
              sock.sendall(struct.pack("<i", len(payload)) + payload)

          command = sys.argv[1]
          last_error = None
          for _ in range(30):
              try:
                  sock = socket.create_connection((HOST, PORT), timeout=5)
                  sock.settimeout(20)
                  break
              except OSError as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"Could not connect to RCON: {last_error}")

          with sock:
              send_packet(sock, 1, 3, PASSWORD)
              auth_id, _, auth_body = recv_packet(sock)
              if auth_id == -1:
                  raise SystemExit(f"RCON authentication failed: {auth_body}")
              send_packet(sock, 2, 2, command)
              if command == "stop":
                  try:
                      _, _, body = recv_packet(sock)
                      print(body)
                  except (ConnectionError, TimeoutError, socket.timeout):
                      pass
              else:
                  response_id, _, body = recv_packet(sock)
                  if response_id != 2:
                      raise SystemExit(f"Unexpected RCON response id {response_id}")
                  print(body)
          PY

          gradle --no-daemon runServer > server-smoke.log 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              python "$RUNNER_TEMP/rcon.py" stop >/dev/null 2>&1 || true
              sleep 3
              kill "$server_pid" 2>/dev/null || true
            fi
            cat server-smoke.log || true
          }
          trap cleanup EXIT

          wait_for_log() {
            local pattern="$1"
            local attempts="${2:-180}"
            for _ in $(seq 1 "$attempts"); do
              if grep -q "$pattern" server-smoke.log 2>/dev/null; then
                return 0
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "Server exited while waiting for: $pattern"
                return 1
              fi
              sleep 1
            done
            echo "Timed out waiting for: $pattern"
            return 1
          }

          wait_for_log "Done (" 180
          echo "Dedicated server reached ready state."
          wait_for_log "Registered required Zian RCT medal payload protocol v1." 120
          echo "Phase 5 required payload protocol registered."
          wait_for_log "Zian RCT medal store ready" 120
          wait_for_log "Registered Zian RCT BATTLE_ENDED listener on RCTApi instance 'rctmod'" 120
          echo "Phase 4 medal runtime initialized with persistent store and RCT BATTLE_ENDED hook."
          wait_for_log "Generated 11 Zian RCT virtual resources" 120
          wait_for_log "generated progression verified for 10 trainers" 120
          wait_for_log "rassvet_leader_novato=0" 120
          echo "Rassvet fixture active: 11 generated resources verified with default relative caps."

          medals_console_response=$(python "$RUNNER_TEMP/rcon.py" medals)
          echo "RCON /medals from console response: $medals_console_response"
          if [[ "$medals_console_response" != *"solo puede ejecutarlo un jugador"* ]]; then
            echo "/medals did not return the expected console-safe message."
            exit 1
          fi
          echo "Console-safe /medals behavior verified."

          config_file="run/config/zianrct.json"
          cp "$config_file" "$RUNNER_TEMP/zianrct-valid.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('run/config/zianrct.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['activeProfile'] = 'missing_profile_for_ci'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          invalid_reload_response=$(python "$RUNNER_TEMP/rcon.py" "zianrct reload")
          echo "RCON invalid /zianrct reload response: $invalid_reload_response"
          if [[ "$invalid_reload_response" != *"No se recargó Zian RCT"* ]]; then
            echo "Invalid config reload was not rejected clearly."
            exit 1
          fi

          verify_before_invalid_followup=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
          echo "RCON /reload while zianrct.json is invalid: $(python "$RUNNER_TEMP/rcon.py" reload)"
          preserved=0
          for _ in $(seq 1 120); do
            verify_after_invalid_followup=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
            if [ "$verify_after_invalid_followup" -gt "$verify_before_invalid_followup" ]; then
              preserved=1
              break
            fi
            sleep 1
          done
          if [ "$preserved" -ne 1 ]; then
            echo "Previous valid ConfigState was not preserved after invalid /zianrct reload."
            exit 1
          fi
          echo "Invalid /zianrct reload preserved the previous active configuration."
          cp "$RUNNER_TEMP/zianrct-valid.json" "$config_file"

          command_verify_before=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
          command_reload_response=$(python "$RUNNER_TEMP/rcon.py" "zianrct reload")
          echo "RCON /zianrct reload response: $command_reload_response"
          if [ -z "$command_reload_response" ] || [[ "$command_reload_response" == *"Unknown or incomplete command"* ]]; then
            echo "Zian RCT reload command was not registered or returned no response."
            exit 1
          fi
          command_verified=0
          for _ in $(seq 1 120); do
            command_verify_after=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
            if [ "$command_verify_after" -gt "$command_verify_before" ]; then
              command_verified=1
              break
            fi
            sleep 1
          done
          if [ "$command_verified" -ne 1 ]; then
            echo "/zianrct reload did not trigger progression verification."
            exit 1
          fi
          echo "Phase 6 /zianrct reload command completed and re-verified progression."

          recipe_before=$(grep -cE "RecipeManager.*Loaded [0-9]+ recipes" server-smoke.log || true)
          verify_before=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
          echo "RCON /reload response: $(python "$RUNNER_TEMP/rcon.py" reload)"
          for _ in $(seq 1 120); do
            recipe_after=$(grep -cE "RecipeManager.*Loaded [0-9]+ recipes" server-smoke.log || true)
            verify_after=$(grep -c "generated progression verified for 10 trainers" server-smoke.log || true)
            if [ "$recipe_after" -gt "$recipe_before" ] && [ "$verify_after" -gt "$verify_before" ]; then
              break
            fi
            sleep 1
          done
          if [ "${recipe_after:-0}" -le "$recipe_before" ] || [ "${verify_after:-0}" -le "$verify_before" ]; then
            echo "Unchanged /reload did not complete verification."
            exit 1
          fi
          echo "Unchanged /reload completed without regeneration loop."

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('run/world/datapacks/rassvet/data/rctmod/trainers/rassvet_leader_novato.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for pokemon in data['team']:
              if pokemon.get('level') == 10:
                  pokemon['level'] = 9
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          generated_before=$(grep -c "Generated 11 Zian RCT virtual resources" server-smoke.log || true)
          echo "RCON team-change /reload response: $(python "$RUNNER_TEMP/rcon.py" reload)"
          changed=0
          for _ in $(seq 1 180); do
            generated_after=$(grep -c "Generated 11 Zian RCT virtual resources" server-smoke.log || true)
            if [ "$generated_after" -gt "$generated_before" ] && grep -q "rassvet_leader_novato=1" server-smoke.log; then
              changed=1
              break
            fi
            sleep 1
          done
          if [ "$changed" -ne 1 ]; then
            echo "Team-level change was not regenerated from the original data pack."
            exit 1
          fi
          echo "Team-level reload test passed: Novato relativeLevelCap changed from 0 to 1."

          list_response=$(python "$RUNNER_TEMP/rcon.py" list)
          echo "RCON post-reload /list response: $list_response"
          if [ -z "$list_response" ]; then
            echo "Server did not answer RCON after reload tests."
            exit 1
          fi
          if grep -qE "Encountered an unexpected exception|Failed to start the minecraft server" server-smoke.log; then
            echo "Fatal server error detected."
            exit 1
          fi

          python "$RUNNER_TEMP/rcon.py" stop >/dev/null 2>&1 || true
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid" || true
              trap - EXIT
              cat server-smoke.log
              exit 0
            fi
            sleep 1
          done
          echo "Server did not stop cleanly."
          exit 1

name: Zian RCT standalone CI
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-server-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Build and unit tests without RCTMod
        run: gradle --no-daemon clean build
      - name: Dedicated server, battles, migration and restart
        run: python tools/standalone-smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zianrct-standalone-${{ github.sha }}
          path: |
            build/libs/zianrct-*.jar
            build/standalone-smoke-evidence/*.log
            build/reports/tests/test/
          if-no-files-found: error

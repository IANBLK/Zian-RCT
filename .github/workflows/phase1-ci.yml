name: Phase 1 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle --no-daemon clean build
      - name: Prepare EULA
        run: mkdir -p run && echo 'eula=true' > run/eula.txt
      - name: Dedicated server smoke test
        shell: bash
        run: |
          set +e
          timeout 180s gradle --no-daemon runServer > server-smoke.log 2>&1
          status=$?
          cat server-smoke.log
          if grep -q "Done (" server-smoke.log; then
            echo "Dedicated server reached ready state."
            exit 0
          fi
          echo "Dedicated server did not reach ready state (timeout/status=$status)."
          exit 1

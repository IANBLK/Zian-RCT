plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:cobblemon-687131:${cobblemon_file_id}"
    implementation "curse.maven:radical-cobblemon-trainers-api-1152792:${rctapi_file_id}"
    implementation "curse.maven:rctmod-1009534:${rctmod_file_id}"
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation("thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}") {
        exclude group: 'net.neoforged.fancymodloader', module: 'loader'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
